let dayDraft = null;       // the day currently being edited in the nested modal
let dayDraftIndex = null;  // index into routineDraft.days, or null if new
let dayDraftIsNew = false;

function openRoutineEditor(id, prefillStart){

function editRoutine(id){ openRoutineEditor(id); }

function renderRoutineModal(isEdit){

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="icon-btn" onclick="deleteDraftDay(${i})" title="Delete day">

        </button>
      </div>
    </div>`).join('') : '<p class="sub">No days yet. Add your first day below — this becomes day 1 of the cycle.</p>';

    <div class="field"><label>Start date</label><input type="text" id="r_start" value="${r.startDate}" oninput="routineDraft.startDate=this.value"></div>

    <div class="divider"></div>
    <button class="btn btn-primary btn-block" onclick="saveRoutine(${isEdit})">Save routine</button>
    ${isEdit?`<button class="btn btn-brick btn-block" style="margin-top:8px;" onclick="deleteRoutine('${r.id}')">Delete routine</button>`:''}
  `);
}

function moveDraftDay(i, dir){
  const days = routineDraft.days;
  const j = i + dir;
  if(j<0 || j>=days.length) return;
  [days[i], days[j]] = [days[j], days[i]];
  renderRoutineModal(!!DB.routines[routineDraft.id]);
}
function deleteDraftDay(i){
  const day = routineDraft.days[i];
  showConfirm({
    title: 'Remove this day?',
    message: `"${escapeHtml(day.name||('Day '+(i+1)))}"${day.taskIds.length?` and its ${day.taskIds.length} assigned task${day.taskIds.length===1?'':'s'}`:''} will be removed from the cycle. This only applies once you save the routine.`,
    confirmLabel: 'Remove day',
    danger: true,
    onCancel: () => renderRoutineModal(!!DB.routines[routineDraft.id]),
    onConfirm: () => {
      routineDraft.days.splice(i,1);
      renderRoutineModal(!!DB.routines[routineDraft.id]);
    }
  });
}

/* Nested "day editor" modal — add or edit a single day's name + tasks, like adding a workout day in LiftLog. */
function openDayEditor(index){
  dayDraftIndex = index;
  dayDraftIsNew = index === null;
  dayDraft = dayDraftIsNew
    ? { name: 'Day '+(routineDraft.days.length+1), taskIds: [] }
    : JSON.parse(JSON.stringify(routineDraft.days[index]));
  renderDayEditorModal();
}
function renderDayEditorModal(){
  const allTasks = Object.values(DB.tasks).filter(t=>!t.archived);
  const taskChips = allTasks.length ? allTasks.map(t=>{
    const sel = dayDraft.taskIds.includes(t.id);
    return `<button class="chip ${sel?'sel':''}" onclick="toggleDayDraftTask('${t.id}')">${escapeHtml(t.icon?t.icon+' ':'')}${escapeHtml(t.name)}</button>`;
  }).join('') : '<p class="sub">No tasks in your library yet — add one from Manage first.</p>';

  if(selectedTasks.length){
    orderList = `<div class="field"><label>Order &amp; duration for this day</label>` +
      selectedTasks.map((t,i)=>{
        const mins = effectivePlannedMinutes(t, dayDraft);
        const isOverridden = dayDraft.overrides && dayDraft.overrides[t.id];
        return `<div class="list-item" style="padding:8px 0;">
          <div class="info"><div class="t" style="font-size:13.5px;">${escapeHtml(t.icon?t.icon+' ':'')}${escapeHtml(t.name)}</div>

            <button class="icon-btn" onclick="moveDayDraftTask(${i},1)" ${i===selectedTasks.length-1?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>
          </div>

    <button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="saveDayEditor()">Save day</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="cancelDayEditor()">Cancel</button>

function moveDayDraftTask(i, dir){

  [dayDraft.taskIds[i], dayDraft.taskIds[j]] = [dayDraft.taskIds[j], dayDraft.taskIds[i]];
  renderDayEditorModal();
}
function setDayDraftOverride(taskId, minutes){
  setDayOverride(dayDraft, taskId, Math.max(0, parseInt(minutes)||0));
  renderDayEditorModal();
}
function toggleDayDraftTask(taskId){
  const idx = dayDraft.taskIds.indexOf(taskId);

function saveRoutine(isEdit){
  const name = document.getElementById('r_name').value.trim();
  if(!name){ toast('Name required'); return; }

  routineDraft.startDate = document.getElementById('r_start').value.trim() || todayISO();
  DB.routines[routineDraft.id] = routineDraft;
  if(!DB.settings.activeRoutineId) DB.settings.activeRoutineId = routineDraft.id;
  saveData();
  closeModal(); renderManage(); renderToday();
  toast(isEdit?'Routine updated':'Routine created');
}
function deleteRoutine(id){
  const r = DB.routines[id];
  const logCount = Object.values(DB.logs).filter(l=>l.routineId===id).length;
  showConfirm({
    title: 'Delete this routine?',
    message: `"${escapeHtml(r.name)}" and its ${r.days.length}-day schedule will be removed. ${logCount>0 ? `${logCount} logged entries from it are kept for your history and streak.` : ''}`,
    confirmLabel: 'Delete routine',
    danger: true,
    onCancel: () => renderRoutineModal(true),
    onConfirm: () => {
      delete DB.routines[id];
      if(DB.settings.activeRoutineId === id) DB.settings.activeRoutineId = Object.keys(DB.routines).find(k=>!DB.routines[k].archived) || null;
      saveData(); renderManage(); renderToday();
    }
  });
}

/* ---- Starting a new plan while preserving streak history ----
   Streak/history are computed from logged activity dates, independent of which
   routine is active, so switching or archiving routines never resets a streak.
   This just archives the current plan (keeping its history intact) and opens
   the editor for a fresh one. */
function startNewRoutinePlan(){
  const cur = activeRoutine();
  if(cur){
    cur.archived = true;
    DB.settings.activeRoutineId = Object.keys(DB.routines).find(k => k!==cur.id && !DB.routines[k].archived) || null;
    saveData();
  }
  openRoutineEditor(null, todayISO());
  toast('Streak & history carry over — build your new plan');
}
function restoreRoutine(id){
  DB.routines[id].archived = false;
  saveData(); renderManage();
  toast('Routine restored');
}

/* =========================================================================
   SWIPE NAVIGATION (Today view only — swipe left/right to move a day,
   same gesture tuning as LiftLog: ignores multi-touch, taps on the date
   strip itself or on form inputs, slow drags, and predominantly-vertical
   drags so it never fights normal scrolling).
   ========================================================================= */
let swipeStartX = null, swipeStartY = null, swipeStartTime = 0;
const SWIPE_MIN_DX = 45;
const SWIPE_MAX_DY = 70;
const SWIPE_TIME_LIMIT = 700;

function handleSwipeStart(e){
  if(e.touches.length !== 1){ swipeStartX = null; return; }
  if(e.target.closest('.date-strip') || e.target.closest('input, textarea, select') || e.target.closest('.modal')){ swipeStartX = null; return; }
  const activeView = document.querySelector('.view.active');
  if(!activeView || activeView.id !== 'view-today'){ swipeStartX = null; return; }
  swipeStartX = e.touches[0].clientX;
  swipeStartY = e.touches[0].clientY;
  swipeStartTime = Date.now();
}
function handleSwipeEnd(e){
  if(swipeStartX === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStartX;
  const dy = t.clientY - swipeStartY;
  const dt = Date.now() - swipeStartTime;
  swipeStartX = null;
  if(dt > SWIPE_TIME_LIMIT) return;
  if(Math.abs(dx) < SWIPE_MIN_DX) return;
  if(Math.abs(dy) > SWIPE_MAX_DY) return;
  if(Math.abs(dx) < Math.abs(dy)) return;
  const direction = dx < 0 ? 1 : -1; // swipe left = next day, swipe right = previous day
  shiftViewDate(direction);
}

/* =========================================================================
   UTIL
   ========================================================================= */
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function emptyState(icon, title, sub, extra){
  return `<div class="empty"><h3 style="font-size:16px;">${title}</h3><p>${sub}</p>${extra||''}</div>`;
}

/* =========================================================================
   INIT
   ========================================================================= */
function init(){
  const params = new URLSearchParams(window.location.search);
  const requestedView = params.get('view');
  const validViews = ['today','calendar','trends','manage','settings'];
  switchView(validViews.includes(requestedView) ? requestedView : 'today');
  refreshHeader();
  const app = document.getElementById('app');
  app.addEventListener('touchstart', handleSwipeStart, { passive:true });
  app.addEventListener('touchend', handleSwipeEnd, { passive:true });
  app.addEventListener('touchcancel', ()=>{ swipeStartX = null; }, { passive:true });
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
init();
</script>
