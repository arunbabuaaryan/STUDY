<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EE">
<title>Routine</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* ============ TOKENS ============ */
:root{
  --paper:#EEF1EE;
  --paper-raised:#FFFFFF;
  --ink:#17231F;
  --ink-soft:#4A5951;
  --ink-faint:#8B968F;
  --line:#DCE2DD;
  --teal:#25594B;
  --teal-soft:#DCEAE4;
  --ember:#C97A2E;
  --ember-soft:#F6E4CC;
  --brick:#A5432F;
  --brick-soft:#F5DCD5;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(23,35,31,.06), 0 4px 16px rgba(23,35,31,.05);
  --display:'Fraunces',Georgia,serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
[data-theme="dark"]{
  --paper:#141B18;
  --paper-raised:#1C2521;
  --ink:#EDF1EE;
  --ink-soft:#AEB9B2;
  --ink-faint:#68746D;
  --line:#2B3733;
  --teal:#5CB89E;
  --teal-soft:#1F3630;
  --ember:#E8A33D;
  --ember-soft:#33291A;
  --brick:#E08770;
  --brick-soft:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.3);
}
[data-theme="hc"]{
  --paper:#FFFFFF;
  --paper-raised:#FFFFFF;
  --ink:#000000;
  --ink-soft:#1A1A1A;
  --ink-faint:#3D3D3D;
  --line:#000000;
  --teal:#00512E;
  --teal-soft:#CFEEE0;
  --ember:#7A3E00;
  --ember-soft:#FBE0BC;
  --brick:#6E0000;
  --brick-soft:#F7CFCF;
  --shadow:0 0 0 2px #000;
}
[data-theme="hc"] .card, [data-theme="hc"] .task, [data-theme="hc"] .btn-ghost,
[data-theme="hc"] .chip, [data-theme="hc"] input, [data-theme="hc"] select, [data-theme="hc"] textarea{
  border-width:2px;
}
/* Text size: zoom scales the whole rendered UI uniformly (Chromium-only,
   which matches this app's target — Chrome on Android). Simpler and more
   complete than hand-picking which font-sizes to convert to rem. */
[data-textsize="sm"] body{ zoom:0.92; }
[data-textsize="lg"] body{ zoom:1.16; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body);
  min-height:100vh; min-height:100dvh; padding-bottom:78px;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0;}
.mono{font-family:var(--mono);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ============ LAYOUT ============ */
#app{max-width:560px; margin:0 auto; padding:0 16px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 0 12px;
}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand h1{font-size:22px; letter-spacing:-.01em;}
.brand .tag{font-size:11px; color:var(--ink-faint); font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em;}
.streakpill{
  display:flex; align-items:center; gap:6px; background:var(--ember-soft); color:var(--ember);
  padding:6px 12px; border-radius:99px; font-family:var(--mono); font-weight:600; font-size:14px;
}
.streakpill svg{width:15px;height:15px;}

.view{display:none; animation:fadein .2s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ============ NAV ============ */
nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; background:var(--paper-raised);
  border-top:1px solid var(--line); display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  z-index:40; max-width:560px; margin:0 auto;
}
nav.tabbar .tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--ink-faint); padding:8px 4px; border-radius:10px; font-size:11px;
}
nav.tabbar .tab svg{width:20px;height:20px;}
nav.tabbar .tab.active{color:var(--teal);}
nav.tabbar .tab.active svg{filter:drop-shadow(0 0 0 var(--teal));}

/* ============ CARDS ============ */
.card{
  background:var(--paper-raised); border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow); margin-bottom:12px; border:1px solid var(--line);
}
.card h3{font-size:15px; margin-bottom:10px;}
.section-title{font-family:var(--mono); text-transform:uppercase; font-size:11px; letter-spacing:.09em; color:var(--ink-faint); margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.section-title::after{content:''; flex:1; height:1px; background:var(--line);}

/* ============ TASK CARD ============ */
.today-layout{display:block;}
.today-side{margin-top:0;}
.task{
  display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--paper-raised);
  border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:8px; transition:all .2s ease;
}
.task.done{background:var(--teal-soft); border-color:var(--teal-soft);}
.task .check{
  width:26px; height:26px; border-radius:50%; border:2px solid var(--line); flex:none;
  display:flex; align-items:center; justify-content:center; background:var(--paper-raised); transition:all .15s ease;
}
.task.done .check{background:var(--teal); border-color:var(--teal);}
.task .check svg{width:14px;height:14px; stroke:white; opacity:0; transform:scale(.5); transition:all .15s ease;}
.task.done .check svg{opacity:1; transform:scale(1);}
.task .body{flex:1; min-width:0;}
.task .name{font-size:15px; font-weight:500;}
.task.done .name{text-decoration:line-through; color:var(--ink-soft);}
.task .meta{font-size:12px; color:var(--ink-faint); font-family:var(--mono); margin-top:2px;}
.task .actions{display:flex; align-items:center; gap:6px;}
.icon-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper-raised);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:none;
}
.icon-btn svg{width:16px;height:16px;}
.icon-btn.on{background:var(--teal); border-color:var(--teal); color:#fff;}
.diff-tag{font-size:10px; padding:2px 7px; border-radius:99px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.04em;}
.diff-easy{background:var(--teal-soft); color:var(--teal);}
.diff-medium{background:var(--ember-soft); color:var(--ember);}
.diff-hard{background:var(--brick-soft); color:var(--brick);}

/* ============ DAY BANNER ============ */
.banner{
  display:flex; align-items:center; gap:12px; padding:16px; border-radius:var(--radius);
  background:linear-gradient(135deg, var(--teal), #1B4238); color:#fff; margin-bottom:14px;
  box-shadow:0 6px 22px rgba(37,89,75,.35); animation:bannerIn .4s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes bannerIn{from{opacity:0; transform:scale(.94) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
.banner .ico{width:38px;height:38px; flex:none;}
.banner h3{color:#fff; font-size:17px;}
.banner p{margin:2px 0 0; font-size:12.5px; opacity:.85; font-family:var(--mono);}

/* ============ TIMER ============ */
.timer-wrap{display:flex; flex-direction:column; align-items:center; padding:22px 10px 8px;}
.dial{position:relative; width:190px; height:190px; margin-bottom:14px;}
.dial svg{transform:rotate(-90deg);}
.dial .track{stroke:var(--line); fill:none; stroke-width:8;}
.dial .prog{stroke:var(--ember); fill:none; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .3s linear;}
.dial .digits{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.dial .digits .t{font-family:var(--mono); font-size:34px; font-weight:600; letter-spacing:-.02em;}
.dial .digits .l{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
.timer-controls{display:flex; gap:10px;}
.btn{
  border:none; border-radius:99px; padding:11px 20px; font-size:14px; font-weight:600;
  display:flex; align-items:center; gap:6px;
}
.btn-primary{background:var(--teal); color:#fff;}
.btn-ghost{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
.btn-ember{background:var(--ember); color:#fff;}
.btn-brick{background:var(--brick-soft); color:var(--brick);}
.btn-block{width:100%; justify-content:center; padding:13px;}
.btn:disabled{opacity:.4;}
.btn-sm{padding:7px 14px; font-size:12.5px; border-radius:99px;}

/* ============ FORMS ============ */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input[type=text], .field input[type=number], .field select, .field textarea{
  width:100%; padding:11px 12px; border-radius:var(--radius-sm); border:1px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:14px;
}
.field textarea{resize:vertical; min-height:60px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.chiprow{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  padding:7px 13px; border-radius:99px; border:1px solid var(--line); background:var(--paper-raised);
  font-size:13px; color:var(--ink-soft);
}
.chip.sel{background:var(--teal); border-color:var(--teal); color:#fff;}

/* ============ CALENDAR ============ */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-head h3{font-size:16px;}
.cal-nav{display:flex; gap:4px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cal-dow{font-size:10px; text-align:center; color:var(--ink-faint); font-family:var(--mono); padding-bottom:4px;}
.cal-cell{
  aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-family:var(--mono); position:relative; background:var(--paper);
  border:1px solid transparent; color:var(--ink-soft);
}
.cal-cell.pad{background:none;}
.cal-cell.level-1{background:var(--teal-soft); color:var(--teal);}
.cal-cell.level-2{background:#9FCBBB; color:#0E2E24;}
.cal-cell.level-3{background:var(--teal); color:#fff; font-weight:700;}
.cal-cell.today{border-color:var(--ember); color:var(--ember); font-weight:700;}
.legend{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--ink-faint); margin-top:10px; font-family:var(--mono);}
.legend .sw{width:11px; height:11px; border-radius:3px;}

/* ============ TRENDS ============ */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.stat{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-sm); padding:13px;}
.stat .v{font-family:var(--mono); font-size:22px; font-weight:700;}
.stat .l{font-size:11px; color:var(--ink-faint); margin-top:2px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.bar-row .lbl{width:74px; font-size:12px; color:var(--ink-soft); flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{flex:1; height:9px; background:var(--paper); border-radius:99px; overflow:hidden;}
.bar-fill{height:100%; background:var(--teal); border-radius:99px;}
.bar-val{font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); width:34px; text-align:right; flex:none;}

/* ============ MANAGE / LISTS ============ */
.list-item{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.list-item .info .t{font-size:14.5px; font-weight:600;}
.list-item .info .s{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.list-item .ctrl{display:flex; gap:6px;}
.empty{text-align:center; padding:36px 16px; color:var(--ink-faint);}
.empty svg{width:40px;height:40px; margin-bottom:10px; opacity:.5;}
.empty p{font-size:13.5px; margin-top:4px;}

/* ============ MODAL ============ */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(15,20,18,.5); display:none; align-items:flex-end;
  justify-content:center; z-index:100; backdrop-filter:blur(2px);
}
.modal-backdrop.active{display:flex; animation:fadein .15s ease;}
.modal{
  background:var(--paper-raised); border-radius:20px 20px 0 0; width:100%; max-width:560px;
  max-height:88vh; overflow-y:auto; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .25s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.xbtn{width:30px; height:30px; border-radius:50%; border:none; background:var(--paper); display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}

.day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex:none; padding:9px 15px; border-radius:99px; border:1px solid var(--line); background:var(--paper-raised); font-size:13px; color:var(--ink-soft); white-space:nowrap;}
.day-tab.sel{background:var(--teal); border-color:var(--teal); color:#fff; font-weight:600;}

/* ============ DATE STRIP (swipe/tap day navigation) ============ */
.date-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:4px;}
.date-strip::-webkit-scrollbar{display:none;}
.date-pill{
  flex:none; width:58px; padding:9px 0 8px; border-radius:14px; border:1px solid var(--line);
  background:var(--paper-raised); display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--ink-soft); position:relative;
}
.date-pill .dow{font-size:10px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);}
.date-pill .dnum{font-size:16px; font-weight:700; font-family:var(--display);}
.date-pill.sel{background:var(--teal); border-color:var(--teal); color:#fff;}
.date-pill.sel .dow{color:rgba(255,255,255,.75);}
.date-pill.istoday:not(.sel){border-color:var(--ember); color:var(--ember);}
.date-pill .ring{width:16px; height:16px; border-radius:50%; flex:none;}
.date-pill .ring-inner{width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; color:inherit;}
.date-nav-btn{
  flex:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper-raised);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}
.date-nav-row{display:flex; align-items:center; gap:8px;}
.date-nav-row .date-strip{flex:1;}
.viewing-note{
  display:flex; align-items:center; gap:8px; background:var(--ember-soft); color:var(--ember);
  padding:9px 13px; border-radius:var(--radius-sm); font-size:12.5px; margin-bottom:12px;
}

/* Applied to #todayContent right after a swipe-triggered day change. */
@keyframes swipeEnterFromRight{ from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:translateX(0);} }
@keyframes swipeEnterFromLeft{ from{opacity:0; transform:translateX(-18px);} to{opacity:1; transform:translateX(0);} }
#todayContent.swipe-enter-from-right{ animation:swipeEnterFromRight .22s cubic-bezier(.22,.61,.36,1); }
#todayContent.swipe-enter-from-left{ animation:swipeEnterFromLeft .22s cubic-bezier(.22,.61,.36,1); }
@media (prefers-reduced-motion: reduce){
  #todayContent.swipe-enter-from-right, #todayContent.swipe-enter-from-left{ animation:none; }
}

/* ============ FOCUS MODE ============ */
.focus-toggle{
  display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:99px;
  border:1px solid var(--line); background:var(--paper-raised); font-size:12.5px; font-weight:600;
  color:var(--ink-soft); margin-bottom:12px;
}
.upnext-row{
  display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:var(--radius-sm);
  border:1px dashed var(--line); color:var(--ink-soft); font-size:13.5px; margin-top:4px;
}
.upnext-row .lbl{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);}
.upnext-row .nm{font-weight:600; flex:1;}
.completed-collapse{ margin-top:14px; }
.completed-collapse summary{
  font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; padding:4px 0;
  font-family:var(--mono); text-transform:uppercase; letter-spacing:.05em;
}
.completed-row{
  display:flex; align-items:center; justify-content:space-between; padding:8px 0;
  border-bottom:1px solid var(--line); font-size:13.5px; color:var(--ink-soft);
}
.completed-row:last-child{border-bottom:none;}

/* Brief success pulse on a checkbox right after marking a task done. */
@keyframes checkPulse{
  0%{ box-shadow:0 0 0 0 rgba(37,89,75,.45); }
  100%{ box-shadow:0 0 0 10px rgba(37,89,75,0); }
}
.check.pulse{ animation:checkPulse .5s ease-out; }
@media (prefers-reduced-motion: reduce){ .check.pulse{ animation:none; } }

.toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
  background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:99px; font-size:13px;
  z-index:200; transition:all .25s ease; pointer-events:none; max-width:90%; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}

.sub{font-size:13px; color:var(--ink-faint); margin:2px 0 16px;}
.link-btn{background:none; border:none; color:var(--teal); font-size:13px; font-weight:600; padding:0;}
.divider{height:1px; background:var(--line); margin:16px 0;}
.hidden{display:none !important;}

/* ============ WIDE / TABLET LANDSCAPE ============ */
@media (min-width: 860px){
  body{ padding-bottom:24px; padding-left:100px; }
  nav.tabbar{
    left:0; right:auto; top:0; bottom:0; max-width:100px; width:100px;
    flex-direction:column; justify-content:flex-start; align-items:center;
    padding:28px 10px; gap:10px; border-top:none; border-right:1px solid var(--line);
  }
  nav.tabbar .tab{ flex:none; width:100%; padding:12px 4px; border-radius:12px; }
  nav.tabbar .tab.active{ background:var(--teal-soft); }
  #app{ max-width:820px; margin:0 auto; padding:0 28px; }
  .today-layout{ display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start; }
  .today-side{ position:sticky; top:24px; }
  .stat-grid{ grid-template-columns:repeat(4,1fr); }
  .cal-grid{ max-width:640px; }
}
@media (min-width: 860px) and (orientation: landscape){
  #app{ max-width:920px; }
  .today-layout{ grid-template-columns:1fr 320px; }
}

::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <h1>Routine</h1>
      <span class="tag" id="activeRoutineLabel">no routine</span>
    </div>
    <div class="streakpill" id="streakPill">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c1-2-1-3-1-5 2 1 4 4 4 7a6 6 0 01-12 0c0-5 3-7 6-11z"/></svg>
      <span id="streakCount">0</span>
    </div>
  </div>

  <!-- TODAY VIEW -->
  <div class="view active" id="view-today">
    <div id="todayContent"></div>
  </div>

  <!-- CALENDAR VIEW -->
  <div class="view" id="view-calendar">
    <div class="card">
      <div class="cal-head">
        <button class="icon-btn" onclick="calShift(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <h3 id="calMonthLabel"></h3>
        <button class="icon-btn" onclick="calShift(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend">
        <span class="sw" style="background:var(--paper);border:1px solid var(--line)"></span> none
        <span class="sw" style="background:var(--teal-soft)"></span> partial
        <span class="sw" style="background:var(--teal)"></span> full
        <span style="margin-left:auto">weekly threshold: <b id="threshLabel">3</b> days</span>
      </div>
      <button class="link-btn hidden" id="jumpTodayBtn" style="margin-top:12px;" onclick="calJumpToday()">← Jump to today</button>
    </div>
    <div class="card" id="dayDetailCard" style="display:none;"></div>
    <div id="monthSummaryCard"></div>
  </div>

  <!-- TRENDS VIEW -->
  <div class="view" id="view-trends">
    <div id="trendsContent"></div>
  </div>

  <!-- MANAGE VIEW -->
  <div class="view" id="view-manage">
    <div id="manageContent"></div>
  </div>

  <!-- SETTINGS VIEW -->

</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   DATA LAYER — normalized store, versioned migrations, plug-in task types
   ========================================================================= */
const DB_KEY = 'studylog_v1';
const SCHEMA_VERSION = 1;

function defaultData(){
  return {
    version: SCHEMA_VERSION,
    routines: {},   // id -> {id, name, days:[{dayIndex, name, taskIds:[]}], startDate, archived, createdAt}
    tasks: {},      // id -> {id, name, icon, type, difficulty, plannedMinutes, archived, createdAt}
    logs: {},        // id -> {id, date, routineId, dayIndex, taskId, completed, actualSeconds, plannedSeconds, note, completedAt}
    settings: { activeRoutineId:null, streakThreshold:3, theme:'light', textSize:'md' }
  };
}

// MIGRATIONS: array of {version, migrate(data)} applied in order for forward-compatible schema evolution.
const MIGRATIONS = [
  // { version: 2, migrate(data){ ... return data; } }
];

function loadData(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(DB_KEY)); }catch(e){ raw = null; }
  if(!raw) return defaultData();
  let data = raw;
  for(const m of MIGRATIONS){
    if((data.version||0) < m.version){ data = m.migrate(data); data.version = m.version; }
  }
  data.version = SCHEMA_VERSION;
  data.settings = Object.assign({activeRoutineId:null, streakThreshold:3, theme:'light', textSize:'md'}, data.settings||{});
  return data;
}
function saveData(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

let DB = loadData();
if(DB.settings.theme && DB.settings.theme !== 'light') document.documentElement.setAttribute('data-theme', DB.settings.theme);
if(DB.settings.textSize && DB.settings.textSize !== 'md') document.documentElement.setAttribute('data-textsize', DB.settings.textSize);

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(sec){ sec = Math.max(0,Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function fmtMin(sec){ return Math.round(sec/60); }

/* TASK_TYPES registry — plug-in point for new task kinds later (e.g. 'reading', 'flashcards').
   Each type controls whether a timer/estimate is shown and how completion is captured. */
const TASK_TYPES = {
  checklist: { label:'Simple check-off', hasTimer:false },
  timed:     { label:'Timed task', hasTimer:true },
};

/* =========================================================================
   ROUTINE / CYCLE HELPERS
   ========================================================================= */
function activeRoutine(){ return DB.settings.activeRoutineId ? DB.routines[DB.settings.activeRoutineId] : null; }

function dayIndexForDate(routine, dateStr){
  if(!routine || !routine.days.length) return null;
  const start = new Date(routine.startDate+'T00:00:00');
  const d = new Date(dateStr+'T00:00:00');
  const diff = Math.floor((d - start) / 86400000);
  if(diff < 0) return null;
  return diff % routine.days.length;
}
function routineDayFor(routine, dateStr){
  const idx = dayIndexForDate(routine, dateStr);
  if(idx === null) return null;
  return routine.days[idx];
}
function taskById(id){ return DB.tasks[id]; }

/* Per-day duration override: a task's plannedMinutes is the default, but a
   specific day in a routine can override it (e.g. "Read chapter" is 15min
   on weekdays but 40min on the Sunday review day). day.overrides is a plain
   map keyed by taskId; days created before this feature just won't have one. */
function effectivePlannedMinutes(task, day){
  if(!task) return 0;
  const override = day && day.overrides && day.overrides[task.id];
  return (override && typeof override.plannedMinutes === 'number') ? override.plannedMinutes : (task.plannedMinutes||0);
}
function setDayOverride(day, taskId, minutes){
  day.overrides = day.overrides || {};
  const task = taskById(taskId);
  if(task && minutes === task.plannedMinutes){
    delete day.overrides[taskId]; // matches the default — no need to store an override
  } else {
    day.overrides[taskId] = { plannedMinutes: minutes };
  }
}

function logsForDate(dateStr){
  return Object.values(DB.logs).filter(l => l.date === dateStr);
}
function logFor(dateStr, taskId){
  return Object.values(DB.logs).find(l => l.date === dateStr && l.taskId === taskId);
}
function upsertLog(patch){
  let log = logFor(patch.date, patch.taskId);
  if(!log){
    log = { id: uid(), date: patch.date, routineId: patch.routineId, dayIndex: patch.dayIndex,
      taskId: patch.taskId, completed:false, actualSeconds:0, plannedSeconds:patch.plannedSeconds||0, note:'', completedAt:null };
    DB.logs[log.id] = log;
  }
  Object.assign(log, patch);
  saveData();
  return log;
}

/* Any date with logged activity (completed OR time actually logged) counts as "studied". */
function hasActivity(log){ return !!(log.completed || (log.actualSeconds||0) > 0); }
function studiedDates(){
  const set = new Set();
  Object.values(DB.logs).forEach(l => { if(hasActivity(l)) set.add(l.date); });
  return set;
}

/* Weekly streak: a week (Mon-Sun) counts if it has >= threshold distinct studied dates.
   Current streak = consecutive qualifying weeks ending at the most recent qualifying week
   (current in-progress week doesn't break the streak while still time to hit threshold). */
function weekStart(date){ // Monday
  const d = new Date(date+'T00:00:00');
  const day = (d.getDay()+6)%7; // 0=Mon
  d.setDate(d.getDate()-day);
  return todayISO(d);
}
function weekKey(dateStr){ return weekStart(dateStr); }

function computeStreaks(){
  const studied = studiedDates();
  const threshold = DB.settings.streakThreshold || 3;
  const byWeek = {};
  studied.forEach(ds => { const wk = weekKey(ds); (byWeek[wk] = byWeek[wk]||new Set()).add(ds); });

  const curWeekKey = weekKey(todayISO());
  const curWeekCount = (byWeek[curWeekKey]||new Set()).size;

  // Walk backwards week by week from the last fully-qualifying week.
  let current = 0, best = 0, run = 0;
  const weeksSorted = Object.keys(byWeek).sort();
  if(weeksSorted.length){
    const first = new Date(weeksSorted[0]+'T00:00:00');
    const lastWeek = new Date(curWeekKey+'T00:00:00');
    for(let d = new Date(first); d <= lastWeek; d.setDate(d.getDate()+7)){
      const wk = todayISO(d);
      const count = (byWeek[wk]||new Set()).size;
      const qualifies = count >= threshold;
      if(qualifies){ run++; best = Math.max(best, run); }
      else if(wk !== curWeekKey){ run = 0; } // current week in progress doesn't zero the run
    }
    current = run;
  }
  return { current, best, curWeekCount, threshold };
}

/* =========================================================================
   TOAST / MODAL
   ========================================================================= */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = escapeHtml(msg);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
let _pendingUndoAction = null;
function toastWithUndo(msg, undoFn, timeoutMs){
  timeoutMs = timeoutMs || 5000;
  _pendingUndoAction = undoFn;
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${escapeHtml(msg)}</span> <button onclick="runUndo()" style="background:none; border:none; color:var(--ember); font-weight:700; margin-left:8px; padding:0; text-decoration:underline;">Undo</button>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); _pendingUndoAction = null; }, timeoutMs);
}
function runUndo(){
  const fn = _pendingUndoAction;
  _pendingUndoAction = null;
  document.getElementById('toast').classList.remove('show');
  clearTimeout(toastTimer);
  if(fn) fn();
}
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('active');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('active'); }
document.getElementById('modalBackdrop').addEventListener('click', e => { if(e.target.id==='modalBackdrop') closeModal(); });

/* =========================================================================
   NAV
   ========================================================================= */
function switchView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.view===v));
  if(v==='today') renderToday();
  if(v==='calendar') renderCalendar();
  if(v==='trends') renderTrends();
  if(v==='manage') renderManage();
  if(v==='settings') renderSettings();
}

function refreshHeader(){
  const r = activeRoutine();
  document.getElementById('activeRoutineLabel').textContent = r ? r.name : 'no routine set';
  const s = computeStreaks();
  document.getElementById('streakCount').textContent = s.current;
}

/* ---- Device-local preferences (mirrors LiftLog's focus-mode/theme pattern:
   these describe how the app behaves on this device, not study data, so
   they live in localStorage rather than the exportable DB). ---- */
function getFocusMode(){ return localStorage.getItem('study_focus_mode') === '1'; }
function setFocusMode(on){ localStorage.setItem('study_focus_mode', on?'1':'0'); renderToday(); }
function getAutoBackupOnComplete(){ return localStorage.getItem('study_auto_backup') === '1'; }
function setAutoBackupOnComplete(on){ localStorage.setItem('study_auto_backup', on?'1':'0'); renderSettings(); }
function markBackupDone(){ localStorage.setItem('study_last_backup_at', Date.now().toString()); }
function daysSinceLastBackup(){
  const raw = localStorage.getItem('study_last_backup_at');
  if(!raw) return null;
  return Math.floor((Date.now()-parseInt(raw))/86400000);
}

/* =========================================================================
   TIMER ENGINE
   ========================================================================= */
let timerState = null; // {taskId, startedAt, elapsedBefore, plannedSeconds, raf, running}

function startTimer(taskId, plannedSeconds){
  stopTimerLoop();
  timerState = { taskId, startedAt: Date.now(), elapsedBefore:0, plannedSeconds: plannedSeconds||0, running:true };
  tickTimer();
}
function pauseTimer(){
  if(!timerState || !timerState.running) return;
  timerState.elapsedBefore += (Date.now() - timerState.startedAt)/1000;
  timerState.running = false;
  stopTimerLoop();
  renderToday();
}
function resumeTimer(){
  if(!timerState || timerState.running) return;
  timerState.startedAt = Date.now();
  timerState.running = true;
  tickTimer();
}
function currentElapsed(){
  if(!timerState) return 0;
  return timerState.elapsedBefore + (timerState.running ? (Date.now()-timerState.startedAt)/1000 : 0);
}
function stopTimerLoop(){ if(timerState && timerState._raf) cancelAnimationFrame(timerState._raf); }
function tickTimer(){
  if(!timerState || !timerState.running) return;
  updateDialDisplay();
  timerState._raf = requestAnimationFrame(tickTimer);
}
function updateDialDisplay(){
  const dt = document.getElementById('dialTime');
  const dp = document.getElementById('dialProg');
  if(!dt || !timerState) return;
  const el = currentElapsed();
  dt.textContent = fmtTime(el);
  if(timerState.plannedSeconds > 0 && dp){
    const pct = Math.min(1, el/timerState.plannedSeconds);
    const C = 2*Math.PI*85;
    dp.style.strokeDasharray = C;
    dp.style.strokeDashoffset = C * (1-pct);
  }
}
function finishTimer(mark){
  if(!timerState) return;
  const el = Math.round(currentElapsed());
  const taskId = timerState.taskId;
  stopTimerLoop();
  const r = activeRoutine();
  const dateStr = todayISO();
  const dayIdx = r ? dayIndexForDate(r, dateStr) : null;
  const log = upsertLog({ date:dateStr, routineId:r?r.id:null, dayIndex:dayIdx, taskId,
    actualSeconds: (logFor(dateStr,taskId)?.actualSeconds||0) + el,
    plannedSeconds: timerState.plannedSeconds, completed: mark });
  timerState = null;
  if(mark){ toast('Task completed'); pulseCheckSoon(taskId); checkMilestones(); }
  renderToday();
  maybeAutoBackup(dateStr);
}

/* ---- Milestones: celebrate round-number "days studied" totals and new
   best streaks, once each, tracked via localStorage so they don't retrigger
   on every subsequent render. ---- */
const DAYS_MILESTONES = [7,14,30,50,100,200,365,500,1000];
function checkMilestones(){
  const studied = studiedDates().size;
  const seenDays = parseInt(localStorage.getItem('routine_ms_days')||'0');
  const nextDaysMilestone = DAYS_MILESTONES.find(m => m<=studied && m>seenDays);
  if(nextDaysMilestone){
    localStorage.setItem('routine_ms_days', String(nextDaysMilestone));
    toast(`🎉 ${nextDaysMilestone} days studied!`);
    return;
  }
  const s = computeStreaks();
  const seenStreak = parseInt(localStorage.getItem('routine_ms_streak')||'0');
  if(s.current>1 && s.current>seenStreak){
    localStorage.setItem('routine_ms_streak', String(s.current));
    toast(`🏆 New best streak: ${s.current} weeks!`);
  }
}

/* =========================================================================
   RENDER: TODAY (date-browsable — swipe or tap the date strip to move
   between days; only "today" allows the timer and future days are read-only)
   ========================================================================= */
let viewDate = todayISO();
function isViewingToday(){ return viewDate === todayISO(); }
function goToDate(ds){
  const direction = ds > viewDate ? 1 : (ds < viewDate ? -1 : 0);
  viewDate = ds;
  renderToday(direction);
}
function shiftViewDate(delta){
  const d = new Date(viewDate+'T00:00:00');
  d.setDate(d.getDate()+delta);
  viewDate = todayISO(d);
  renderToday(delta);
}
function applySwipeAnim(el, direction){
  if(!direction) return;
  const cls = direction>0 ? 'swipe-enter-from-right' : 'swipe-enter-from-left';
  el.classList.remove('swipe-enter-from-right','swipe-enter-from-left');
  void el.offsetWidth; // force reflow so back-to-back swipes always restart the animation
  el.classList.add(cls);
}

function completionLevelForDate(r, ds){
  const day = routineDayFor(r, ds);
  if(!day || !day.taskIds.length) return 'none';
  const doneCount = day.taskIds.filter(id => (logFor(ds,id)||{}).completed).length;
  if(doneCount===0) return 'none';
  if(doneCount>=day.taskIds.length) return 'full';
  return 'partial';
}

function renderDateStrip(){
  const today = todayISO();
  const r = activeRoutine();
  const center = new Date(viewDate+'T00:00:00');
  let pills = '';
  for(let i=-3;i<=3;i++){
    const d = new Date(center); d.setDate(d.getDate()+i);
    const ds = todayISO(d);
    const sel = ds === viewDate;
    const isToday = ds === today;
    const dow = d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2).toUpperCase();
    const level = r ? completionLevelForDate(r, ds) : 'none';
    let ringHtml;
    if(level==='full') ringHtml = `<div class="ring" style="background:${sel?'#fff':'var(--teal)'};"></div>`;
    else if(level==='partial') ringHtml = `<div class="ring" style="background:conic-gradient(${sel?'#fff':'var(--teal)'} 180deg, ${sel?'rgba(255,255,255,.3)':'var(--line)'} 0deg);"></div>`;
    else ringHtml = `<div class="ring" style="background:${sel?'rgba(255,255,255,.3)':'var(--line)'};"></div>`;
    pills += `<button class="date-pill ${sel?'sel':''} ${isToday?'istoday':''}" onclick="goToDate('${ds}')">
      <span class="dow">${dow}</span><span class="dnum">${d.getDate()}</span>${ringHtml}
    </button>`;
  }
  return `<div class="date-nav-row">
    <button class="date-nav-btn" onclick="shiftViewDate(-1)" title="Previous day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="date-strip">${pills}</div>
    <button class="date-nav-btn" onclick="shiftViewDate(1)" title="Next day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6 6-6"/></svg>
    </button>
  </div>`;
}

function renderToday(swipeDirection){
  const el = document.getElementById('todayContent');
  const r = activeRoutine();
  const today = todayISO();
  const viewingToday = viewDate === today;
  const isFuture = viewDate > today;
  const strip = renderDateStrip();

  if(!r){
    el.innerHTML = strip + emptyState('calendar', 'No active routine', 'Create a routine in Manage to start tracking tasks.',
      '<button class="btn btn-primary btn-block" onclick="switchView(\'manage\')">Go to Manage</button>');
    refreshHeader(); applySwipeAnim(el, swipeDirection);
    return;
  }
  const day = routineDayFor(r, viewDate);
  const dayIdx = dayIndexForDate(r, viewDate);
  if(!day){
    el.innerHTML = strip + emptyState('calendar','Routine hasn&#39;t started yet', 'This day is before the routine\'s start date.');
    refreshHeader(); applySwipeAnim(el, swipeDirection);
    return;
  }
  const tasks = day.taskIds.map(taskById).filter(Boolean);
  const logs = tasks.map(t => logFor(viewDate, t.id));
  const allDone = tasks.length>0 && logs.every(l => l && l.completed);
  const doneCount = logs.filter(l => l && l.completed).length;

  let main = strip;

  if(!viewingToday){
    main += `<div class="viewing-note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 2"/></svg>
      ${isFuture ? 'Previewing an upcoming day — tasks can be logged once it arrives.' : 'Viewing a past day — you can still check things off retroactively.'}
    </div>`;
  }

  main += `<div class="section-title">Day ${dayIdx+1} of ${r.days.length} · ${day.name||''}</div>`;

  if(allDone){
    main += `<div class="banner">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
      <div><h3>All tasks finished</h3><p>${tasks.length} task${tasks.length>1?'s':''} completed. Nice work.</p></div>
    </div>`;
  }

  if(!tasks.length){
    main += emptyState('calendar','No tasks for this day','Add tasks to this routine day from Manage.');
  } else {
    const focusEligible = viewingToday && !isFuture;
    if(focusEligible && tasks.length>0){
      main += `<button class="focus-toggle" onclick="setFocusMode(${!getFocusMode()})" title="${getFocusMode() ? 'Switch to full list' : 'Switch to guided focus mode'}">
        ${getFocusMode() ? '🎯 Focus' : '☰ List'}
      </button>`;
    }
    if(focusEligible && getFocusMode() && !allDone){
      main += renderFocusBody(tasks, viewDate, day);
    } else {
      main += tasks.map(t => renderTaskRow(t, viewDate, isFuture, false, day)).join('');
    }
  }

  let side;
  if(timerState && viewingToday) side = renderTimerPanel();
  else side = renderDaySummaryPanel(r, dayIdx, tasks, doneCount, viewingToday, isFuture, day);

  el.innerHTML = `<div class="today-layout"><div class="today-main">${main}</div><div class="today-side">${side}</div></div>`;
  if(timerState && viewingToday) updateDialDisplay();
  refreshHeader();
  applySwipeAnim(el, swipeDirection);
}

function renderTaskRow(t, dateStr, disabled, highlighted, day){
  const log = logFor(dateStr, t.id);
  const done = !!(log && log.completed);
  const isTimed = t.type === 'timed';
  const isActiveTimer = timerState && timerState.taskId === t.id && dateStr===todayISO();
  const canTimer = isTimed && !disabled && dateStr===todayISO();
  const mins = effectivePlannedMinutes(t, day);
  const hasNote = log && log.note;
  return `<div class="task ${done?'done':''}" id="task-${t.id}" style="${highlighted?'border-color:var(--teal); border-width:2px;':''}">
    <button class="check" ${disabled?'disabled style="opacity:.35; pointer-events:none;"':''} onclick="toggleTask('${t.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
    </button>
    <div class="body">
      <div class="name">${escapeHtml(t.icon?t.icon+' ':'')}${escapeHtml(t.name)}</div>
      <div class="meta">${t.difficulty?`<span class="diff-tag diff-${t.difficulty}">${t.difficulty}</span> · `:''}${isTimed ? (mins?mins+' min planned':'timed') : 'checklist'}${log && log.actualSeconds ? ' · logged '+fmtMin(log.actualSeconds)+'m' : ''}${hasNote?' · 📝':''}</div>
    </div>
    <div class="actions">
      <button class="icon-btn ${hasNote?'on':''}" onclick="openNoteEditor('${t.id}','${dateStr}')" title="Note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.85 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
      </button>
      ${canTimer ? `<button class="icon-btn ${isActiveTimer?'on':''}" onclick="openTimer('${t.id}')" title="Timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </button>` : ''}
    </div>
  </div>`;
}

function renderFocusBody(tasks, dateStr, day){
  const incomplete = tasks.filter(t => !(logFor(dateStr,t.id)||{}).completed);
  const doneCount = tasks.length - incomplete.length;
  if(!incomplete.length) return '';
  const activeT = incomplete[0];
  const upNext = incomplete[1];
  let html = renderTaskRow(activeT, dateStr, false, true, day);
  if(upNext){
    html += `<div class="upnext-row" onclick="toggleTask('${activeT.id}')">
      <span class="lbl">Up next</span><span class="nm">${escapeHtml(upNext.icon?upNext.icon+' ':'')}${escapeHtml(upNext.name)}</span>
      <span>→</span>
    </div>`;
  }
  if(doneCount>0){
    html += `<details class="completed-collapse"><summary>✅ Completed (${doneCount}/${tasks.length})</summary>`;
    tasks.filter(t=>(logFor(dateStr,t.id)||{}).completed).forEach(t=>{
      html += `<div class="completed-row">${escapeHtml(t.icon?t.icon+' ':'')}${escapeHtml(t.name)} <span class="diff-tag diff-easy">done</span></div>`;
    });
    html += `</details>`;
  }
  return html;
}

function renderWeekGlance(r){
  const wkStart = weekStart(todayISO());
  const today = todayISO();
  const labels = ['M','T','W','T','F','S','S'];
  let html = '<div style="display:flex; gap:6px;">';
  for(let i=0;i<7;i++){
    const d = new Date(wkStart+'T00:00:00'); d.setDate(d.getDate()+i);
    const ds = todayISO(d);
    const isFutureDay = ds > today;
    const isToday = ds === today;
    const level = r ? completionLevelForDate(r, ds) : 'none';
    let bg = 'var(--line)';
    if(!isFutureDay){
      if(level==='full') bg = 'var(--teal)';
      else if(level==='partial') bg = 'var(--teal-soft)';
    } else {
      bg = 'var(--paper)';
    }
    html += `<button onclick="goToDate('${ds}')" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:none; background:none; padding:0;">
      <div style="width:100%; height:24px; border-radius:6px; background:${bg}; border:${isToday?'2px solid var(--ember)':'1px solid var(--line)'};"></div>
      <span style="font-size:9px; color:var(--ink-faint); font-family:var(--mono);">${labels[i]}</span>
    </button>`;
  }
  html += '</div>';
  return html;
}

    ` : `<div class="divider"></div><p class="sub" style="margin:0;">All caught up${viewingToday?' for today':''}.</p>`}

function stopTimerNoComplete(){ finishTimer(false); }

function openTimer(taskId){
  if(!isViewingToday()){ toast('Timers are only available for today'); return; }
  const t = taskById(taskId);
  const day = routineDayFor(activeRoutine(), todayISO());
  const mins = effectivePlannedMinutes(t, day);
  if(timerState && timerState.taskId !== taskId){
    const prevName = (taskById(timerState.taskId)||{}).name || '';
    showConfirm({
      title: 'Switch task?',
      message: `Current timer progress on "${escapeHtml(prevName)}" hasn't been saved yet — switching now discards it unless you finish that task first.`,
      confirmLabel: 'Switch anyway',
      danger: true,
      onConfirm: () => { startTimer(taskId, mins*60); renderToday(); }
    });
    return;
  }
  startTimer(taskId, mins*60);
  renderToday();
}

function toggleTask(taskId){
  if(viewDate > todayISO()){ toast('Can\'t log a day that hasn\'t happened yet'); return; }
  const r = activeRoutine();
  const dateStr = viewDate;
  const dayIdx = dayIndexForDate(r, dateStr);
  const day = routineDayFor(r, dateStr);
  const t = taskById(taskId);
  const existing = logFor(dateStr, taskId);
  const nowDone = !(existing && existing.completed);

  if(!nowDone && existing && existing.completed){
    upsertLog({ date:dateStr, routineId:r.id, dayIndex:dayIdx, taskId, completed:false });
    renderToday();
    toastWithUndo('Marked incomplete', () => {
      upsertLog({ date:dateStr, routineId:r.id, dayIndex:dayIdx, taskId, completed:true });
      renderToday();
    });
    return;
  }
  const plannedSec = (TASK_TYPES[t.type] && TASK_TYPES[t.type].hasTimer) ? effectivePlannedMinutes(t, day)*60 : 0;
  upsertLog({ date:dateStr, routineId:r.id, dayIndex:dayIdx, taskId, completed:true, plannedSeconds:plannedSec });
  renderToday();
  pulseCheckSoon(taskId);
  maybeAutoBackup(dateStr);
  checkMilestones();
}

function openNoteEditor(taskId, dateStr){

function saveNote(taskId, dateStr){

  const r = activeRoutine();

/* Brief success pulse on the checkbox right after it's marked done — added
   post-render since renderToday() just rebuilt the DOM from scratch. */
function pulseCheckSoon(taskId){
  requestAnimationFrame(()=>{
    const row = document.getElementById('task-'+taskId);
    const chk = row && row.querySelector('.check');
    if(!chk) return;
    chk.classList.add('pulse');
    setTimeout(()=>chk.classList.remove('pulse'), 550);
  });
}

/* Auto-backup: when a day's full task list is completed (today only — this
   never fires for retroactive past-day edits), optionally trigger the same
   JSON export the manual "Export JSON" button uses. Opt-in, device-local,
   same shape as LiftLog's auto-backup-on-workout-complete. */
function maybeAutoBackup(dateStr){
  if(dateStr !== todayISO()) return;
  if(!getAutoBackupOnComplete()) return;
  const r = activeRoutine();
  if(!r) return;
  const day = routineDayFor(r, dateStr);
  if(!day || !day.taskIds.length) return;
  const allDone = day.taskIds.every(id => (logFor(dateStr,id)||{}).completed);
  if(allDone){ exportData(); toast('Day complete — backup saved'); }
}

let calCursor = new Date(); calCursor.setDate(1);
function calShift(n){ calCursor.setMonth(calCursor.getMonth()+n); renderCalendar(); }

function completionLevelFor(dateStr){
  const r = activeRoutine();
  const logs = logsForDate(dateStr);
  const activeCount = logs.filter(hasActivity).length;
  const doneCount = logs.filter(l=>l.completed).length;
  if(activeCount === 0) return 0;
  const day = r ? routineDayFor(r, dateStr) : null;
  const scheduled = day ? day.taskIds.length : null;
  if(scheduled && doneCount >= scheduled) return 3;
  if(scheduled && activeCount >= Math.ceil(scheduled/2)) return 2;
  return 1;
}

function renderCalendar(){
  document.getElementById('threshLabel').textContent = DB.settings.streakThreshold;
  const label = calCursor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  document.getElementById('calMonthLabel').textContent = label;

  const grid = document.getElementById('calGrid');
  const dows = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  const year = calCursor.getFullYear(), month = calCursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startPad = (firstDay.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = todayISO();

  for(let i=0;i<startPad;i++) html += `<div class="cal-cell pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const level = completionLevelFor(dateStr);
    const isToday = dateStr === todayStr;
    html += `<div class="cal-cell level-${level} ${isToday?'today':''}" onclick="showDayDetail('${dateStr}')">${d}</div>`;
  }
  grid.innerHTML = html;
  document.getElementById('dayDetailCard').style.display = 'none';

  const isCurrentMonth = todayStr.startsWith(year+'-'+String(month+1).padStart(2,'0')+'-');
  document.getElementById('jumpTodayBtn').classList.toggle('hidden', isCurrentMonth);
  document.getElementById('monthSummaryCard').innerHTML = renderMonthSummary(year, month, daysInMonth);
  refreshHeader();
}
function calJumpToday(){
  calCursor = new Date(); calCursor.setDate(1);
  renderCalendar();
}

function renderMonthSummary(year, month, daysInMonth){
  const monthPrefix = year+'-'+String(month+1).padStart(2,'0')+'-';
  const monthLogs = Object.values(DB.logs).filter(l=>l.date.startsWith(monthPrefix));
  const activityLogs = monthLogs.filter(hasActivity);
  const studiedThisMonth = new Set(activityLogs.map(l=>l.date));
  const totalSeconds = activityLogs.reduce((a,l)=>a+(l.actualSeconds||0),0);
  const todayStr = todayISO();
  const isCurrentMonth = todayStr.startsWith(monthPrefix);
  const daysElapsed = isCurrentMonth ? new Date(todayStr+'T00:00:00').getDate() : daysInMonth;
  const pct = daysElapsed ? Math.round((studiedThisMonth.size/daysElapsed)*100) : 0;

  if(!activityLogs.length){
    return `<div class="card"><h3 style="margin-bottom:6px;">This month</h3><p class="sub" style="margin:0;">No activity logged yet.</p></div>`;
  }

  const perTask = {};
  monthLogs.filter(l=>l.completed).forEach(l=>{
    const t = taskById(l.taskId); if(!t) return;
    perTask[l.taskId] = perTask[l.taskId] || { name:t.name, count:0 };
    perTask[l.taskId].count++;
  });
  const taskRows = Object.values(perTask).sort((a,b)=>b.count-a.count).slice(0,5);
  const maxCount = Math.max(...taskRows.map(r=>r.count), 1);

  let html = `<div class="card">
    <h3 style="margin-bottom:12px;">This month</h3>
    <div class="stat-grid">
      <div class="stat"><div class="v mono">${studiedThisMonth.size}/${daysElapsed}</div><div class="l">days studied</div></div>
      <div class="stat"><div class="v mono">${pct}%</div><div class="l">consistency</div></div>
      <div class="stat"><div class="v mono">${Math.round(totalSeconds/3600*10)/10}h</div><div class="l">time logged</div></div>
      <div class="stat"><div class="v mono">${activityLogs.length}</div><div class="l">sessions</div></div>
    </div>`;
  if(taskRows.length){
    html += `<div class="divider"></div><label style="font-size:12px;color:var(--ink-soft);font-weight:600;">Top tasks this month</label><div style="margin-top:8px;">`;
    taskRows.forEach(r=>{
      const barPct = (r.count/maxCount)*100;
      html += `<div class="bar-row"><div class="lbl">${escapeHtml(r.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${barPct}%"></div></div><div class="bar-val">${r.count}×</div></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

/* ---- Reusable SVG radar/spider chart. labels/values must be same length,
   3+ axes recommended. Pure SVG, no dependencies. ---- */
function renderRadarChart(labels, values, size){
  size = size || 230;
  const cx = size/2, cy = size/2;
  const R = size/2 - 30;
  const n = labels.length;
  const maxVal = Math.max(...values, 1);
  const angleFor = i => (Math.PI*2*i/n) - Math.PI/2;
  const pointAt = (i, frac) => {
    const a = angleFor(i);
    return [cx + Math.cos(a)*R*frac, cy + Math.sin(a)*R*frac];
  };
  let gridPolys = '';
  [0.33,0.66,1].forEach(frac=>{
    const pts = labels.map((_,i)=>pointAt(i,frac).join(',')).join(' ');
    gridPolys += `<polygon points="${pts}" style="fill:none; stroke:var(--line); stroke-width:1;"/>`;
  });
  const axisLines = labels.map((_,i)=>{
    const [x,y] = pointAt(i,1);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line); stroke-width:1;"/>`;
  }).join('');
  const dataPts = values.map((v,i)=>pointAt(i, maxVal ? v/maxVal : 0).join(',')).join(' ');
  const dots = values.map((v,i)=>{
    const [x,y] = pointAt(i, maxVal ? v/maxVal : 0);
    return `<circle cx="${x}" cy="${y}" r="2.5" style="fill:var(--teal);"/>`;
  }).join('');
  const labelEls = labels.map((l,i)=>{
    const [x,y] = pointAt(i, 1.22);
    return `<text x="${x}" y="${y}" font-size="10" style="fill:var(--ink-faint); font-family:var(--mono);" text-anchor="middle" dominant-baseline="middle">${escapeHtml(l)}</text>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible;">
    ${gridPolys}${axisLines}
    <polygon points="${dataPts}" style="fill:var(--teal); fill-opacity:0.25; stroke:var(--teal); stroke-width:2;"/>
    ${dots}${labelEls}
  </svg>`;
}

/* ---- Donut chart via CSS conic-gradient + legend. segments: [{label,value,color}] ---- */
function renderDonut(segments){
  const total = segments.reduce((a,s)=>a+s.value,0);
  if(!total) return '<p class="sub" style="margin:0;">No data yet.</p>';
  let acc = 0;
  const stops = segments.map(s=>{
    const start = acc/total*360; acc += s.value; const end = acc/total*360;
    return `${s.color} ${start}deg ${end}deg`;
  }).join(', ');
  const legend = segments.map(s=>`<div style="display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;">
    <span style="width:10px; height:10px; border-radius:3px; background:${s.color}; display:inline-block; flex:none;"></span>
    <span style="flex:1;">${escapeHtml(s.label)}</span>
    <span class="mono" style="color:var(--ink-faint);">${s.value}</span>
  </div>`).join('');
  return `<div style="display:flex; align-items:center; gap:22px;">
    <div style="width:104px; height:104px; border-radius:50%; background:conic-gradient(${stops}); flex:none;"></div>
    <div style="flex:1;">${legend}</div>
  </div>`;
}

function renderMilestonesCard(totalDaysStudied, bestStreak){
  const achieved = DAYS_MILESTONES.filter(m=>totalDaysStudied>=m);
  const next = DAYS_MILESTONES.find(m=>m>totalDaysStudied);
  let html = `<div class="card"><h3 style="margin-bottom:10px;">Milestones</h3>`;
  html += `<div class="chiprow">`;
  DAYS_MILESTONES.slice(0,6).forEach(m=>{
    const hit = totalDaysStudied>=m;
    html += `<span class="chip ${hit?'sel':''}">${hit?'✓ ':''}${m}d</span>`;
  });
  html += `</div>`;
  if(next){
    const prev = achieved.length ? achieved[achieved.length-1] : 0;
    const pct = Math.min(100, Math.round(((totalDaysStudied-prev)/(next-prev))*100));
    html += `<div class="bar-row" style="margin-top:12px;"><div class="lbl" style="width:auto; flex:none; margin-right:8px;">Next: ${next}d</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-val">${totalDaysStudied}/${next}</div></div>`;
  }
  if(bestStreak>0){
    html += `<p class="sub" style="margin:10px 0 0;">🏆 Best streak so far: ${bestStreak} week${bestStreak===1?'':'s'}.</p>`;
  }
  html += `</div>`;
  return html;
}

function generateWeeklySummaryText(){
  const wkStart = weekStart(todayISO());
  const dates = [];
  for(let i=0;i<7;i++){ const d=new Date(wkStart+'T00:00:00'); d.setDate(d.getDate()+i); dates.push(todayISO(d)); }
  const s = computeStreaks();
  const studied = studiedDates();
  let totalSec = 0, completedCount = 0;
  const perTaskCount = {};
  dates.forEach(ds=>{
    logsForDate(ds).forEach(l=>{
      if(hasActivity(l)) totalSec += (l.actualSeconds||0);
      if(l.completed){
        completedCount++;
        const t = taskById(l.taskId);
        if(t) perTaskCount[t.name] = (perTaskCount[t.name]||0)+1;
      }
    });
  });
  const daysStudiedThisWeek = dates.filter(ds=>studied.has(ds)).length;
  const r = activeRoutine();
  let text = `Weekly summary — ${dates[0]} to ${dates[6]}\n`;
  text += `Routine: ${r?r.name:'—'}\n`;
  text += `Days studied: ${daysStudiedThisWeek}/7\n`;
  text += `Tasks completed: ${completedCount}\n`;
  text += `Time logged: ${Math.round(totalSec/3600*10)/10}h\n`;
  text += `Current streak: ${s.current} week${s.current===1?'':'s'} (best ${s.best})\n`;
  if(Object.keys(perTaskCount).length){
    text += `\nBy task:\n`;
    Object.entries(perTaskCount).sort((a,b)=>b[1]-a[1]).forEach(([name,count])=>{ text += `  - ${name}: ${count}x\n`; });
  }
  return text;
}

function renderTrends(){
  const el = document.getElementById('trendsContent');
  const completedLogs = Object.values(DB.logs).filter(l=>l.completed);
  const activityLogs = Object.values(DB.logs).filter(hasActivity);
  const s = computeStreaks();

  if(!activityLogs.length){
    el.innerHTML = emptyState('bar','No data yet','Complete a few tasks and trends will show up here.');
    return;
  }

  const totalSeconds = activityLogs.reduce((a,l)=>a+(l.actualSeconds||0),0);
  const studied = studiedDates();
  const totalDaysStudied = studied.size;
  const avgSessionMin = Math.round((totalSeconds/activityLogs.length)/60) || 0;

  // per-task aggregation (based on completions, for "how often did I do this")
  const perTask = {};
  completedLogs.forEach(l=>{
    const t = taskById(l.taskId); if(!t) return;
    perTask[l.taskId] = perTask[l.taskId] || { name:t.name, count:0, totalSec:0, plannedSec:0 };
    perTask[l.taskId].count++;
    perTask[l.taskId].totalSec += (l.actualSeconds||0);
    perTask[l.taskId].plannedSec += (l.plannedSeconds||0);
  });
  const taskRows = Object.values(perTask).sort((a,b)=>b.count-a.count).slice(0,8);
  const timedTaskRows = taskRows.filter(r=>r.plannedSec>0);
  const maxCount = Math.max(...taskRows.map(r=>r.count),1);

  // weekday distribution (any activity)
  const wdCounts = [0,0,0,0,0,0,0]; // Mon..Sun
  studied.forEach(ds=>{
    const day = (new Date(ds+'T00:00:00').getDay()+6)%7;
    wdCounts[day]++;
  });
  const wdLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const maxWd = Math.max(...wdCounts,1);
  const bestWdIdx = wdCounts.indexOf(Math.max(...wdCounts));
  const bestWdFull = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][bestWdIdx];

  // last 8 weeks trend
  const weeks = [];
  const cursor = new Date(weekStart(todayISO())+'T00:00:00');
  for(let i=7;i>=0;i--){
    const d = new Date(cursor); d.setDate(d.getDate() - i*7);
    const wk = todayISO(d);
    let count = 0;
    studied.forEach(ds => { if(weekKey(ds)===wk) count++; });
    weeks.push({ wk, count, label: (d.getMonth()+1)+'/'+d.getDate() });
  }
  const maxWeek = Math.max(...weeks.map(w=>w.count), DB.settings.streakThreshold, 1);

  // consistency: studied days / calendar days since first activity
  const allDates = Array.from(studied).sort();
  const firstDate = allDates[0];
  const daysSinceFirst = Math.max(1, Math.round((new Date(todayISO()+'T00:00:00') - new Date(firstDate+'T00:00:00'))/86400000) + 1);
  const consistencyPct = Math.round((totalDaysStudied/daysSinceFirst)*100);

  // longest single logged session
  const longest = activityLogs.reduce((max,l)=> (l.actualSeconds||0) > max ? (l.actualSeconds||0) : max, 0);

  // difficulty mix (completed tasks)
  const diffCounts = { easy:0, medium:0, hard:0 };
  completedLogs.forEach(l=>{ const t = taskById(l.taskId); if(t && t.difficulty && diffCounts[t.difficulty]!==undefined) diffCounts[t.difficulty]++; });
  const diffTotal = diffCounts.easy+diffCounts.medium+diffCounts.hard;

  let html = '';
  html += `<button class="btn btn-ghost btn-block" style="margin-bottom:12px;" onclick="openWeeklySummary()">📋 Weekly summary (copy/share as text)</button>`;
  html += `<div class="stat-grid">
    <div class="stat"><div class="v mono">${totalDaysStudied}</div><div class="l">days studied</div></div>
    <div class="stat"><div class="v mono">${s.current} / ${s.best}</div><div class="l">current / best streak</div></div>
    <div class="stat"><div class="v mono">${Math.round(totalSeconds/3600*10)/10}h</div><div class="l">total time logged</div></div>
    <div class="stat"><div class="v mono">${consistencyPct}%</div><div class="l">consistency since ${firstDate}</div></div>
  </div>`;

  html += renderMilestonesCard(totalDaysStudied, s.best);

  html += `<div class="card"><h3>Last 8 weeks</h3>`;
  html += `<div style="display:flex; align-items:flex-end; gap:6px; height:80px; margin-top:6px;">`;
  weeks.forEach(w=>{
    const h = Math.max(4, (w.count/maxWeek)*100);
    const met = w.count >= DB.settings.streakThreshold;
    html += `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <div style="width:100%; height:70px; display:flex; align-items:flex-end;">
        <div style="width:100%; height:${h}%; background:${met?'var(--teal)':'var(--line)'}; border-radius:4px 4px 2px 2px;"></div>
      </div>
      <div style="font-size:9px; color:var(--ink-faint); font-family:var(--mono);">${w.label}</div>
    </div>`;
  });
  html += `</div><p class="sub" style="margin:10px 0 0;">Dark bars = weeks that met your ${DB.settings.streakThreshold}-day streak threshold.</p></div>`;

  html += `<div class="card"><h3>Studied by weekday</h3>`;
  wdLabels.forEach((l,i)=>{
    const pct = (wdCounts[i]/maxWd)*100;
    html += `<div class="bar-row"><div class="lbl">${l}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:var(--ember);"></div></div><div class="bar-val">${wdCounts[i]}</div></div>`;
  });
  if(maxWd>0) html += `<p class="sub" style="margin:8px 0 0;">You study most on ${bestWdFull}s.</p>`;
  html += `</div>`;

  html += `<div class="card"><h3 style="margin-bottom:2px;">Weekly rhythm</h3><p class="sub" style="margin:0 0 8px;">Same data as above, shaped as a week.</p>
    <div style="display:flex; justify-content:center;">${renderRadarChart(wdLabels.map(l=>l[0]), wdCounts, 220)}</div></div>`;

  html += `<div class="stat-grid" style="grid-template-columns:1fr 1fr;">
    <div class="stat"><div class="v mono">${fmtMin(longest)}m</div><div class="l">longest single session</div></div>
    <div class="stat"><div class="v mono">${activityLogs.length}</div><div class="l">total sessions logged</div></div>
  </div>`;

  html += `<div class="card"><h3>Time per task (top 8)</h3>`;
  taskRows.forEach(r=>{
    const pct = (r.count/maxCount)*100;
    html += `<div class="bar-row"><div class="lbl">${escapeHtml(r.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-val">${r.count}×</div></div>`;
  });
  html += `</div>`;

  if(taskRows.length>=3){
    const radarTasks = taskRows.slice(0,6);
    html += `<div class="card"><h3 style="margin-bottom:2px;">Task balance</h3><p class="sub" style="margin:0 0 8px;">Are you favoring some tasks over others?</p>
      <div style="display:flex; justify-content:center;">${renderRadarChart(radarTasks.map(r=>r.name.length>8?r.name.slice(0,7)+'…':r.name), radarTasks.map(r=>r.count), 230)}</div></div>`;
  }

  if(diffTotal>0){
    html += `<div class="card"><h3>Difficulty mix</h3>`;
    html += renderDonut([
      {label:'Easy', value:diffCounts.easy, color:'var(--teal)'},
      {label:'Medium', value:diffCounts.medium, color:'var(--ember)'},
      {label:'Hard', value:diffCounts.hard, color:'var(--brick)'}
    ].filter(s=>s.value>0));
    html += `</div>`;
  }

  // time by subject/category
  const catColors = ['var(--teal)','var(--ember)','var(--brick)','#6B8FB8','#9B6FB0','#B08A4E'];
  const perCat = {};
  activityLogs.forEach(l=>{
    const t = taskById(l.taskId); if(!t) return;
    const cat = t.category && t.category.trim() ? t.category.trim() : 'Uncategorized';
    perCat[cat] = (perCat[cat]||0) + (l.actualSeconds||0);
  });
  const catEntries = Object.entries(perCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(catEntries.length>1 || (catEntries.length===1 && catEntries[0][0]!=='Uncategorized')){
    html += `<div class="card"><h3>Time by subject</h3>`;
    html += renderDonut(catEntries.map(([label,value],i)=>({label, value:Math.round(value/60), color:catColors[i%catColors.length]})));
    html += `<p class="sub" style="margin:8px 0 0;">In minutes. Set a subject on a task from Manage to break this down further.</p></div>`;
  }

  if(timedTaskRows.length){
    html += `<div class="card"><h3>Estimate accuracy</h3><div>`;
    timedTaskRows.slice(0,6).forEach(r=>{
      const avgActual = r.totalSec/r.count/60;
      const avgPlanned = r.plannedSec/r.count/60;
      const diff = avgActual - avgPlanned;
      const sign = diff>0?'+':'';
      html += `<div class="list-item"><div class="info"><div class="t">${escapeHtml(r.name)}</div>
        <div class="s">avg ${Math.round(avgActual)}m actual vs ${Math.round(avgPlanned)}m planned</div></div>
        <div class="s mono" style="color:${diff>0?'var(--brick)':'var(--teal)'}">${sign}${Math.round(diff)}m</div></div>`;
    });
    html += `</div></div>`;
  }

  el.innerHTML = html;
}

          <div class="info"><div class="t">${escapeHtml(r.name)}</div>

      });

      });
    }
  }

  el.innerHTML = html;
}
let archivedTasksOpen = false;
function toggleArchivedTasks(){ archivedTasksOpen = !archivedTasksOpen; renderManage(); }

function duplicateRoutine(id){
  const src = DB.routines[id];
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.name = src.name + ' copy';
  copy.startDate = todayISO();
  copy.archived = false;
  copy.createdAt = Date.now();
  DB.routines[copy.id] = copy;
  saveData();
  toast('Routine duplicated');
  openRoutineEditor(copy.id);
}

function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'routine-backup-'+todayISO()+'.json'; a.click();
  URL.revokeObjectURL(url);
  markBackupDone();
  renderSettings();

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
      if(!parsed.routines || !parsed.tasks || !parsed.logs) throw new Error('bad shape');
    }catch(err){ toast('Import failed — invalid file'); return; }
    showConfirm({
      title: 'Replace all data?',
      message: 'Importing overwrites every routine, task, and logged day currently on this device with the contents of this file. This can\'t be undone unless you have another backup.',
      confirmLabel: 'Replace data',
      danger: true,
      requireText: 'REPLACE',
      onConfirm: () => {
        DB = parsed; DB.version = SCHEMA_VERSION; saveData();
        toast('Data imported');
        renderManage(); renderSettings(); refreshHeader();
      }
    });
  };
  reader.readAsText(file);
}

/* ---- Generic typed-confirmation modal for anything destructive. Mirrors
   LiftLog's showConfirm/requireText pattern: low-risk actions get a plain
   confirm, genuinely irreversible ones (wiping data) require typing an
   exact phrase so a stray tap can never trigger them. ---- */
let _pendingConfirmAction = null;
let _pendingCancelAction = null;
let _pendingRequireText = null;
function showConfirm({title, message, confirmLabel='Confirm', danger=false, requireText=null, onConfirm, onCancel}){
  _pendingConfirmAction = onConfirm;
  _pendingCancelAction = onCancel || null;
  _pendingRequireText = requireText;
  openModal(`
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="xbtn" onclick="cancelConfirm()">✕</button></div>
    <p style="font-size:13.5px; color:var(--ink-soft); line-height:1.5;">${message}</p>
    ${requireText ? `<div class="field" style="margin-top:14px;"><label>Type "${escapeHtml(requireText)}" to confirm</label>
      <input type="text" id="confirmTypedInput" autocomplete="off" autocapitalize="off" oninput="checkConfirmTypedInput(this.value)"></div>` : ''}
    <button id="confirmActionBtn" class="btn ${danger?'btn-brick':'btn-primary'} btn-block" style="margin-top:12px;" ${requireText?'disabled':''} onclick="runConfirmedAction()">${escapeHtml(confirmLabel)}</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="cancelConfirm()">Cancel</button>
  `);
}
function checkConfirmTypedInput(value){
  document.getElementById('confirmActionBtn').disabled = value !== _pendingRequireText;
}
function runConfirmedAction(){
  const action = _pendingConfirmAction;
  _pendingConfirmAction = null; _pendingCancelAction = null; _pendingRequireText = null;
  closeModal();
  if(action) action();
}
function cancelConfirm(){
  const c = _pendingCancelAction;
  _pendingConfirmAction = null; _pendingCancelAction = null; _pendingRequireText = null;
  if(c) c(); else closeModal();
}

function confirmClearHistory(){
  const totalLogs = Object.keys(DB.logs).length;
  showConfirm({
    title: 'Clear all history?',
    message: `This permanently deletes all ${totalLogs} logged entries — every completed task, streak, and calendar mark. Your routines and task library stay exactly as they are.`,
    confirmLabel: 'Clear history',
    danger: true,
    requireText: 'CLEAR',
    onConfirm: () => {
      DB.logs = {};
      saveData();
      toast('History cleared');
      renderSettings(); renderToday(); refreshHeader();
    }
  });
}
function confirmResetAll(){
  showConfirm({
    title: 'Reset the app?',
    message: 'This deletes everything — every routine, every task, every logged day — and returns the app to a blank first-run state. There is no undo unless you exported a backup first.',
    confirmLabel: 'Reset everything',
    danger: true,
    requireText: 'RESET',
    onConfirm: () => {

      switchView('manage');

/* ---- Task editor ---- */

  `);
}
function editTask(id){ openTaskEditor(id); }
function saveTask(id, existing){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Name required'); return; }
  const type = document.getElementById('f_type').value;
  const t = {
    id, name,
    icon: document.getElementById('f_icon').value.trim(),
    type,
    plannedMinutes: type==='timed' ? (parseInt(document.getElementById('f_planned').value)||0) : 0,
    difficulty: document.getElementById('f_diff').value,
    category: document.getElementById('f_category').value.trim(),
    archived: DB.tasks[id]?.archived || false,
    createdAt: DB.tasks[id]?.createdAt || Date.now()
  };
  DB.tasks[id] = t; saveData();
  closeModal(); renderManage(); renderToday();
  toast(existing==='true' || existing===true ? 'Task updated' : 'Task created');
}
/* Soft-delete: archiving keeps the task object (so old logs still resolve
   its name in Trends/Calendar) and just pulls it off every routine day.
   Reversible via "Show archived tasks" in Manage, plus an instant Undo. */
function archiveTaskFlow(id){
  const t = taskById(id);
  const dayCount = countTaskDayAssignments(id);
  showConfirm({
    title: 'Archive this task?',
    message: dayCount>0
      ? `"${escapeHtml(t.name)}" is scheduled on ${dayCount} day${dayCount===1?'':'s'} across your routines. Archiving removes it from all of them and hides it from the library — you can restore it any time.`
      : `"${escapeHtml(t.name)}" isn't currently on any routine day. It'll move to the archived list and can be restored any time.`,
    confirmLabel: 'Archive task',
    danger: true,
    onCancel: () => openTaskEditor(id),
    onConfirm: () => archiveTask(id, true)
  });
}
function archiveTask(id, showUndo){
  const removedFrom = [];
  Object.values(DB.routines).forEach(r=>r.days.forEach(d=>{
    if(d.taskIds.includes(id)) removedFrom.push({routineId:r.id, taskIds:[...d.taskIds]});
    d.taskIds = d.taskIds.filter(x=>x!==id);
  }));
  DB.tasks[id].archived = true;
  saveData(); renderManage(); renderToday();
  if(showUndo){
    toastWithUndo('Task archived', () => { restoreTask(id); });
  }
}
function restoreTask(id){
  DB.tasks[id].archived = false;
  saveData(); renderManage(); renderToday();
  toast('Task restored — reassign it to days from Manage');
}

function countTaskDayAssignments(taskId){
  let count = 0;
  Object.values(DB.routines).forEach(r=>{ if(!r.archived) r.days.forEach(d=>{ if(d.taskIds.includes(taskId)) count++; }); });
  return count;
}

/* ---- Assign a task to days directly from the Task Library — the missing
   link that used to force going through the full routine editor just to
   attach an existing task to a day. Mutates DB.routines directly (no draft/
   save step) since it's a single, low-risk toggle, same as Set Active. ---- */
function openAssignDaysModal(taskId){
  const routines = Object.values(DB.routines).filter(r=>!r.archived);
  if(!routines.length){ toast('Create a routine first'); return; }
  const defaultId = (DB.settings.activeRoutineId && DB.routines[DB.settings.activeRoutineId] && !DB.routines[DB.settings.activeRoutineId].archived)
    ? DB.settings.activeRoutineId : routines[0].id;
  renderAssignDaysModal(taskId, defaultId);
}
function renderAssignDaysModal(taskId, routineId){
  const t = taskById(taskId);
  const routines = Object.values(DB.routines).filter(r=>!r.archived);
  const r = DB.routines[routineId];
  const routineOptions = routines.map(rt=>`<option value="${rt.id}" ${rt.id===routineId?'selected':''}>${escapeHtml(rt.name)}</option>`).join('');
  const dayRows = r.days.length ? r.days.map((d,i)=>{
    const sel = d.taskIds.includes(taskId);
    const mins = effectivePlannedMinutes(t, d);
    const isOverridden = d.overrides && d.overrides[taskId];
    return `<div style="margin-bottom:8px;">
      <button class="chip ${sel?'sel':''}" style="width:100%; display:flex; align-items:center; text-align:left;" onclick="toggleTaskInDay('${routineId}',${i},'${taskId}')">
        <span style="flex:1;">${sel?'✓ ':''}${escapeHtml(d.name||('Day '+(i+1)))}</span>
        <span style="opacity:.65; font-size:11px;">${d.taskIds.length} task${d.taskIds.length===1?'':'s'}</span>
      </button>
      ${sel && t.type==='timed' ? `<div style="display:flex; align-items:center; gap:8px; margin-top:6px; padding-left:4px;">
        <span style="font-size:11.5px; color:var(--ink-faint);">Minutes for this day:</span>
        <input type="number" min="0" value="${mins}" style="width:64px; padding:5px 8px; border-radius:8px; border:1px solid var(--line); background:var(--paper); font-size:12.5px;"
          onchange="setDayOverrideAndRerender('${routineId}',${i},'${taskId}', this.value)">
        ${isOverridden ? `<span style="font-size:11px; color:var(--ember);">custom</span>` : `<span style="font-size:11px; color:var(--ink-faint);">default</span>`}
      </div>` : ''}
    </div>`;
  }).join('') : '<p class="sub">This routine has no days yet.</p>';

  openModal(`
    <div class="modal-head"><h3>Assign "${escapeHtml(t.name)}"</h3><button class="xbtn" onclick="closeModal()">✕</button></div>
    ${routines.length>1 ? `<div class="field"><label>Routine</label><select id="assignRoutineSelect" onchange="renderAssignDaysModal('${taskId}', this.value)">${routineOptions}</select></div>` : ''}
    <label style="font-size:12px;color:var(--ink-soft);font-weight:600;">Days in ${escapeHtml(r.name)}</label>
    <div style="margin-top:8px;">${dayRows}</div>
    <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="closeModal(); renderManage();">Done</button>
  `);
}
function toggleTaskInDay(routineId, dayIdx, taskId){
  const day = DB.routines[routineId].days[dayIdx];
  const idx = day.taskIds.indexOf(taskId);
  if(idx>-1) day.taskIds.splice(idx,1); else day.taskIds.push(taskId);
  saveData();
  renderAssignDaysModal(taskId, routineId);
  renderToday();
}
function setDayOverrideAndRerender(routineId, dayIdx, taskId, minutes){
  const day = DB.routines[routineId].days[dayIdx];
  setDayOverride(day, taskId, Math.max(0, parseInt(minutes)||0));
  saveData();
  renderAssignDaysModal(taskId, routineId);
  renderToday();
}

/* ---- Bulk assign: pick several tasks, pick several days in one routine,
   add them all in a single action instead of one task at a time. ---- */
let bulkSelectedTasks = new Set();
let bulkSelectedDays = new Set();
function openBulkAssignModal(){
  const routines = Object.values(DB.routines).filter(r=>!r.archived);
  if(!routines.length){ toast('Create a routine first'); return; }
  bulkSelectedTasks = new Set();
  bulkSelectedDays = new Set();
  const defaultId = (DB.settings.activeRoutineId && DB.routines[DB.settings.activeRoutineId] && !DB.routines[DB.settings.activeRoutineId].archived)
    ? DB.settings.activeRoutineId : routines[0].id;
  renderBulkAssignModal(defaultId);
}
function renderBulkAssignModal(routineId){
  const routines = Object.values(DB.routines).filter(r=>!r.archived);
  const r = DB.routines[routineId];
  const tasks = Object.values(DB.tasks).filter(t=>!t.archived);
  const routineOptions = routines.map(rt=>`<option value="${rt.id}" ${rt.id===routineId?'selected':''}>${escapeHtml(rt.name)}</option>`).join('');
  const taskChips = tasks.map(t=>`<button class="chip ${bulkSelectedTasks.has(t.id)?'sel':''}" onclick="toggleBulkTask('${t.id}', '${routineId}')">${escapeHtml(t.icon?t.icon+' ':'')}${escapeHtml(t.name)}</button>`).join('');
  const dayChips = r.days.map((d,i)=>`<button class="chip ${bulkSelectedDays.has(i)?'sel':''}" onclick="toggleBulkDay(${i}, '${routineId}')">${escapeHtml(d.name||('Day '+(i+1)))}</button>`).join('');

  openModal(`
    <div class="modal-head"><h3>Bulk assign</h3><button class="xbtn" onclick="closeModal()">✕</button></div>
    ${routines.length>1 ? `<div class="field"><label>Routine</label><select onchange="bulkSelectedDays=new Set(); renderBulkAssignModal(this.value)">${routineOptions}</select></div>` : ''}
    <div class="field"><label>Tasks</label><div class="chiprow">${taskChips || '<p class="sub">No tasks yet.</p>'}</div></div>
    <div class="field"><label>Days in ${escapeHtml(r.name)}</label><div class="chiprow">${dayChips || '<p class="sub">This routine has no days yet.</p>'}</div></div>
    <button class="btn btn-primary btn-block" style="margin-top:6px;" ${(!bulkSelectedTasks.size||!bulkSelectedDays.size)?'disabled':''} onclick="applyBulkAssign('${routineId}')">
      Add ${bulkSelectedTasks.size||0} task${bulkSelectedTasks.size===1?'':'s'} to ${bulkSelectedDays.size||0} day${bulkSelectedDays.size===1?'':'s'}
    </button>
  `);
}
function toggleBulkTask(taskId, routineId){
  if(bulkSelectedTasks.has(taskId)) bulkSelectedTasks.delete(taskId); else bulkSelectedTasks.add(taskId);
  renderBulkAssignModal(routineId);
}
function toggleBulkDay(dayIdx, routineId){
  if(bulkSelectedDays.has(dayIdx)) bulkSelectedDays.delete(dayIdx); else bulkSelectedDays.add(dayIdx);
  renderBulkAssignModal(routineId);
}
function applyBulkAssign(routineId){
  const r = DB.routines[routineId];
  bulkSelectedDays.forEach(dayIdx=>{
    const day = r.days[dayIdx];
    bulkSelectedTasks.forEach(taskId=>{
      if(!day.taskIds.includes(taskId)) day.taskIds.push(taskId);
    });
  });
  saveData();
  toast(`Added to ${bulkSelectedDays.size} day${bulkSelectedDays.size===1?'':'s'}`);
  closeModal(); renderManage(); renderToday();
}

/* ---- Routine editor (LiftLog-style: build days as a list, edit each separately) ---- */
